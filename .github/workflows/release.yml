name: Build & Release Binaries 🚀

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write # 🔥 CRITICAL: Ini wajib ditambahin biar GitHub ngasih izin nulis package!

jobs:
  build-and-release:
    name: 🏗️ Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🔨 Build for NPM
        run: bun run build

      # ═══════════════════════════════════════════
      # 📦 1. PUBLISH KE NPM (npmjs.com)
      # ═══════════════════════════════════════════
      - name: 🔑 Auth NPM
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: 🚀 Publish NPM
        run: npm publish --access public

      # ═══════════════════════════════════════════
      # 🐙 2. PUBLISH KE GITHUB PACKAGES (Sidebar)
      # ═══════════════════════════════════════════
      - name: 🔑 Auth GitHub Packages
        # GITHUB_TOKEN ini otomatis dibikinin sama GitHub tiap kali action jalan, gausah lu bikin manual di secrets!
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc

      - name: 🚀 Publish GitHub
        # Pake flag --registry biar dia nge-push ke server GitHub, bukan NPM lagi
        run: npm publish --registry=https://npm.pkg.github.com/

      # --- 🏗️ COMPILE STEP (Cross-Platform) ---

      - name: 🪟 Build for Windows (x64)
        run: bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile dist/digester-win-x64.exe

      - name: 🐧 Build for Linux (x64)
        run: bun build ./src/index.ts --compile --target=bun-linux-x64 --outfile dist/digester-linux-x64

      - name: 🍎 Build for macOS (Silicon/M1+)
        run: bun build ./src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/digester-macos-arm64

      - name: 🍎 Build for macOS (Intel)
        run: bun build ./src/index.ts --compile --target=bun-darwin-x64 --outfile dist/digester-macos-x64

      # --- 🚀 RELEASE STEP ---

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/digester-win-x64.exe
            dist/digester-linux-x64
            dist/digester-macos-arm64
            dist/digester-macos-x64
          generate_release_notes: true # Otomatis generate notes dari commit message
