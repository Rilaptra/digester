
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digester Documentation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        :root {
            --bg-color: #1e1e2e;
            --sidebar-bg: #181825;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --link-color: #f5c2e7;
            --border-color: #313244;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        aside {
            width: 300px;
            height: 100vh;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            overflow-y: auto;
            padding: 20px;
        }
        main {
            margin-left: 340px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        h1, h2, h3 {
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        a {
            color: var(--link-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        pre {
            background-color: #11111b;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }
        code {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
        }
        .sidebar-item {
            margin-bottom: 10px;
        }
        .sidebar-link {
            display: block;
            padding: 5px 10px;
            border-radius: 4px;
            color: var(--text-color);
        }
        .sidebar-link:hover {
            background-color: var(--border-color);
            text-decoration: none;
        }
        blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: 20px;
            margin-left: 0;
            font-style: italic;
            color: #a6adc8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: var(--sidebar-bg);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            aside {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            main {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <h2>⚡ Digester</h2>
        <div id="nav-links"></div>
    </aside>
    <main id="content">
        Loading documentation...
    </main>

    <script type="module">
        import { marked } from 'marked';
        import hljs from 'highlight.js';

        // Custom renderer to add IDs to headers for navigation
        const renderer = new marked.Renderer();
        renderer.heading = ({ text, depth, raw }) => {
            const id = raw.toLowerCase().replace(/[^\w]+/g, '-');
            return `<h${depth} id="${id}">${text}</h${depth}>`;
        };

        marked.setOptions({
            renderer,
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        const markdownContent = `CONTENT_PLACEHOLDER`;

        document.getElementById('content').innerHTML = marked.parse(markdownContent);

        // Generate Sidebar
        const headers = Array.from(document.querySelectorAll('h1, h2, h3'));
        const navLinks = document.getElementById('nav-links');
        headers.forEach(header => {
            const link = document.createElement('a');
            link.href = '#' + header.id;
            link.innerText = header.innerText;
            link.className = 'sidebar-link';
            link.style.paddingLeft = (header.tagName === 'H1' ? '10px' : header.tagName === 'H2' ? '20px' : '30px');
            navLinks.appendChild(link);
        });
    </script>
</body>
</html>
